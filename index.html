main{max-width:60rem;margin:0 auto;padding:0 1.25rem 4rem}

.mod b{font:700 1.3rem/1.2 var(--disp);margin-top:.3rem}
.mod small{font:500 .92rem/1.4 var(--body);color:#6A4A3E}
.mod .go{margin-top:auto;font:600 .95rem var(--body)}
.mod.off{opacity:.62;box-shadow:0 10px 18px -12px rgba(43,23,16,.4)}
.mod.off .n{background:#E9DED3}
